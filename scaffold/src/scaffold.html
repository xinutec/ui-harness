<mat-toolbar>
  @let up = place.up();
  <!-- The root first: its leading slot is the navigation menu. -->
  @if (!up) {
    @if (menu(); as menu) {
      <!-- A count of what needs attention behind the menu, hidden at 0; the label
           says it in words, since a badge is only seen. -->
      <button
        matIconButton
        [matMenuTriggerFor]="menu"
        [attr.aria-label]="menuLabel()"
        [matBadge]="menuBadge()"
        [matBadgeHidden]="!menuBadge()"
        matBadgeSize="small"
      >
        <mat-icon>menu</mat-icon>
      </button>
    }
    <!-- A top-level screen beside the root may name itself; the root is the app. -->
    <h1 [class.provisional]="place.title()?.provisional">{{ place.title()?.text ?? title() }}</h1>
  } @else {
    <!-- A button, not an `a`: the rule that centres a glyph in its circle is
         `button[matIconButton]`, an element selector. -->
    @if (up.opener && place.opened()) {
      <button matIconButton (click)="location.back()" [attr.aria-label]="up.label">
        <mat-icon>arrow_back</mat-icon>
      </button>
    } @else {
      <button matIconButton [routerLink]="up.path" [queryParams]="up.query" [attr.aria-label]="up.label">
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
    @if (place.leading(); as leading) {
      <ng-container [ngTemplateOutlet]="leading" />
    }
    <h1 [class.provisional]="place.title()?.provisional">{{ place.title()?.text }}</h1>
  }
  <span class="spacer"></span>
  <ng-content />
  @if (place.actions(); as actions) {
    <ng-container [ngTemplateOutlet]="actions" />
  }
</mat-toolbar>
